<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DDoS Shield Real</title>
    <style>
      :root {
        color: #eef7f2;
        background: #07100d;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #07100d, #121d18 48%, #161712);
      }
      main {
        width: min(1180px, calc(100% - 28px));
        margin: 0 auto;
        padding: 28px 0 calc(126px + env(safe-area-inset-bottom));
      }
      header, .metrics, .content, .dock, .row, .panel-head {
        display: flex;
        gap: 14px;
      }
      header {
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 4.3rem);
        line-height: .95;
      }
      .eyebrow {
        margin: 0 0 6px;
        color: #83eda2;
        font-size: .78rem;
        font-weight: 900;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .status {
        border: 1px solid rgba(132, 239, 164, .32);
        border-radius: 999px;
        padding: 12px 16px;
        background: rgba(15, 32, 25, .86);
        color: #baffca;
        font-weight: 900;
        white-space: nowrap;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        margin-bottom: 14px;
      }
      .metric, .panel {
        border: 1px solid rgba(255,255,255,.11);
        border-radius: 8px;
        background: rgba(13, 25, 21, .84);
        box-shadow: 0 24px 70px rgba(0,0,0,.24);
      }
      .metric {
        padding: 18px;
        min-height: 92px;
      }
      .metric span {
        display: block;
        color: #9fb4aa;
        font-size: .86rem;
      }
      .metric strong {
        display: block;
        margin-top: 6px;
        font-size: 1.7rem;
      }
      .content {
        display: grid;
        grid-template-columns: 1fr;
      }
      .module-panel { display: none; }
      .module-panel.active { display: block; }
      .panel {
        min-width: 0;
        padding: 18px;
      }
      .panel-head {
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      h2, h3 { margin: 0; }
      .row {
        display: grid;
        grid-template-columns: 112px minmax(130px, 1.1fr) 76px minmax(120px, .9fr) 90px 90px 90px;
        gap: 12px;
        align-items: center;
        min-height: 44px;
        margin-bottom: 8px;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(255,255,255,.04);
        color: #dbe9e1;
        font-size: .88rem;
      }
      .blocked-row {
        display: grid;
        grid-template-columns: minmax(140px, 1fr) minmax(240px, 2fr) 90px 100px;
        gap: 12px;
        align-items: center;
        min-height: 44px;
        margin-bottom: 8px;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(255,255,255,.04);
      }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; color: #acc3b6; }
      .badge {
        display: inline-flex;
        justify-content: center;
        min-width: 68px;
        padding: 6px 8px;
        border-radius: 999px;
        font-size: .76rem;
        font-weight: 900;
      }
      .high { background: rgba(255,76,76,.17); color: #ffaaa4; }
      .mid { background: rgba(255,204,81,.15); color: #ffd983; }
      .low { background: rgba(109,241,145,.14); color: #9effb1; }
      .pipeline {
        display: grid;
        gap: 10px;
      }
      .model-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, .8fr);
        gap: 14px;
      }
      .pipeline div, .control-box {
        padding: 12px;
        border-radius: 8px;
        background: rgba(255,255,255,.04);
        color: #d8e8df;
      }
      .control-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 10px 0;
      }
      .control-actions button {
        min-height: 42px;
        border: 0;
        border-radius: 8px;
        background: #7cf29d;
        color: #06100b;
        font-weight: 900;
        cursor: pointer;
      }
      .control-actions button.stop { background: #ffaaa4; }
      .control-box span {
        display: block;
        color: #9fb4aa;
        font-size: .82rem;
      }
      .control-box strong {
        display: block;
        margin-top: 4px;
        overflow-wrap: anywhere;
      }
      .dock {
        position: fixed;
        left: 50%;
        bottom: calc(18px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: min(720px, calc(100% - 28px));
        padding: 8px;
        border: 1px solid rgba(198, 239, 213, .28);
        border-radius: 18px;
        background: rgba(14, 24, 20, .88);
        backdrop-filter: blur(20px);
        box-shadow: 0 18px 60px rgba(0,0,0,.36);
        z-index: 20;
      }
      .dock button {
        flex: 1;
        min-width: 0;
        min-height: 50px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: #b7c8bf;
        font-weight: 900;
        cursor: pointer;
      }
      .dock button.active {
        background: rgba(126, 242, 157, .18);
        color: #effff4;
        box-shadow: inset 0 0 0 1px rgba(126,242,157,.25);
      }
      @media (max-width: 900px) {
        main { width: min(100% - 18px, 760px); padding-top: 18px; }
        header { flex-direction: column; align-items: flex-start; }
        .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .model-grid { grid-template-columns: 1fr; }
        .row { grid-template-columns: 92px minmax(0, 1fr) 76px 76px; }
        .row span:nth-child(3), .row span:nth-child(4), .row span:nth-child(5) { display: none; }
        .blocked-row { grid-template-columns: minmax(0, 1fr) 82px; }
        .blocked-row span:nth-child(2), .blocked-row span:nth-child(4) { display: none; }
      }
      @media (max-width: 560px) {
        main { width: calc(100% - 14px); padding-bottom: calc(154px + env(safe-area-inset-bottom)); }
        h1 { font-size: 2.15rem; }
        .status { width: 100%; justify-content: center; text-align: center; }
        .metrics { grid-template-columns: 1fr 1fr; gap: 8px; }
        .metric { padding: 12px; min-height: 78px; }
        .metric strong { font-size: 1.35rem; }
        .panel { padding: 12px; }
        .panel-head { align-items: flex-start; flex-direction: column; gap: 8px; }
        .row { grid-template-columns: 82px minmax(0, 1fr) 62px 62px; gap: 8px; padding: 10px; }
        .badge { min-width: 58px; }
        .dock {
          width: calc(100% - 14px);
          border-radius: 14px;
        }
        .dock button {
          min-height: 54px;
          font-size: .82rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Trafico real del servidor</p>
          <h1>DDoS Shield Real</h1>
        </div>
        <div class="status" id="status">Cargando</div>
      </header>

      <section class="metrics">
        <article class="metric"><span>Riesgo promedio</span><strong id="avgRisk">0%</strong></article>
        <article class="metric"><span>Eventos analizados</span><strong id="rowsProcessed">0</strong></article>
        <article class="metric"><span>Alertas activas</span><strong id="attacksNow">0</strong></article>
        <article class="metric"><span>IPs detectadas</span><strong id="blockedCount">0</strong></article>
      </section>

      <section class="content">
        <article class="panel module-panel active" id="trafficPanel" data-module="traffic">
          <div class="panel-head">
            <h2>Analisis de trafico</h2>
            <span class="mono" id="health">/api/health</span>
          </div>
          <div id="trafficRows"></div>
        </article>

        <article class="panel module-panel" id="blockedPanel" data-module="blocked">
          <div class="panel-head">
            <h2>IPs atacantes</h2>
            <span id="blockedTotal">0</span>
          </div>
          <div id="blockedRows"></div>
        </article>

        <section class="module-panel" id="modelPanel" data-module="model">
          <div class="model-grid">
            <article class="panel">
              <div class="panel-head">
                <h2>Modelo LSTM</h2>
                <span class="mono" id="modelShape">Cargando</span>
              </div>
              <div class="pipeline" id="pipeline"></div>
            </article>
            <article class="panel">
              <div class="panel-head">
                <h2>Control</h2>
                <span class="mono">captura real</span>
              </div>
              <div class="control-actions">
                <button onclick="startCapture()">Iniciar monitoreo</button>
                <button class="stop" onclick="stopCapture()">Detener</button>
              </div>
              <div class="pipeline" id="captureStatus"></div>
            </article>
          </div>
        </section>
      </section>
    </main>

    <nav class="dock">
      <button class="active" data-target="traffic" onclick="showPanel('traffic')">Trafico</button>
      <button data-target="blocked" onclick="showPanel('blocked')">Bloqueos</button>
      <button data-target="model" onclick="showPanel('model')">Modelo</button>
    </nav>

    <script>
      function badgeClass(risk) {
        if (risk >= 80) return "badge high";
        if (risk >= 55) return "badge mid";
        return "badge low";
      }

      let activePanel = "traffic";

      function emptyState(text) {
        return `<div class="control-box"><strong>${text}</strong></div>`;
      }

      async function refresh() {
        let overview, traffic, blocked, model, health, capture;
        try {
          [overview, traffic, blocked, model, health, capture] = await Promise.all([
            fetch("/api/overview").then(r => r.json()),
            fetch("/api/traffic").then(r => r.json()),
            fetch("/api/blocked-ips").then(r => r.json()),
            fetch("/api/model").then(r => r.json()),
            fetch("/api/health").then(r => r.json()),
            fetch("/api/capture/status").then(r => r.json())
          ]);
        } catch (error) {
          document.getElementById("status").textContent = "Sin conexion con API";
          return;
        }

        document.getElementById("status").textContent = overview.status;
        document.getElementById("avgRisk").textContent = `${overview.avgRisk}%`;
        document.getElementById("rowsProcessed").textContent = overview.rowsProcessed ?? 0;
        document.getElementById("attacksNow").textContent = overview.attacksNow;
        document.getElementById("blockedCount").textContent = overview.blockedCount;
        document.getElementById("blockedTotal").textContent = overview.blockedCount;
        document.getElementById("health").textContent = `${health.mode} | threshold ${health.threshold}`;
        document.getElementById("modelShape").textContent = `${health.timesteps} x ${health.feature_count} variables`;

        const trafficItems = traffic.traffic.slice(0, 18);
        document.getElementById("trafficRows").innerHTML = trafficItems.length ? trafficItems.map(item => `
          <div class="row">
            <span class="mono">${item.time}</span>
            <strong>${item.sourceIp}</strong>
            <span>${item.protocol}</span>
            <span>${item.attack}</span>
            <span>${item.pps > 0 ? `${item.pps} pps` : "sin tasa"}</span>
            <span>${Math.round((item.probability || 0) * 100)}% IA</span>
            <span class="${badgeClass(item.risk)}">${item.risk}%</span>
          </div>
        `).join("") : emptyState("Todavia no hay flujos procesados.");

        const blockedItems = blocked.blockedIps.slice(0, 12);
        document.getElementById("blockedRows").innerHTML = blockedItems.length ? blockedItems.map(item => `
          <div class="blocked-row">
            <strong>${item.ip}</strong>
            <span>${item.reason}</span>
            <span class="${badgeClass(item.risk)}">${item.risk}%</span>
            <span class="mono">${item.since}</span>
          </div>
        `).join("") : emptyState("No hay IPs bloqueadas o detectadas.");

        document.getElementById("pipeline").innerHTML = model.pipeline.map(step => `<div>${step}</div>`).join("");
        document.getElementById("captureStatus").innerHTML = `
          <div class="control-box"><span>Estado</span><strong>${capture.enabled ? "Monitoreo activo" : "Monitoreo detenido"} ${capture.running ? "(capturando ahora)" : ""}</strong></div>
          <div class="control-box"><span>Interfaz</span><strong>${capture.interface}</strong></div>
          <div class="control-box"><span>CICFlowMeter</span><strong>${capture.cicflowmeterConfigured ? "Configurado" : "No configurado"}</strong></div>
          <div class="control-box"><span>Ultimo CSV</span><strong>${capture.lastFile || "Pendiente"}</strong></div>
          <div class="control-box"><span>Errores</span><strong>${capture.lastError || "Sin errores"}</strong></div>
        `;
      }

      function showPanel(panel) {
        activePanel = panel;
        document.querySelectorAll(".module-panel").forEach(item => {
          item.classList.toggle("active", item.dataset.module === panel);
        });
        document.querySelectorAll(".dock button").forEach(button => {
          button.classList.toggle("active", button.dataset.target === panel);
        });
        refresh();
      }

      async function startCapture() {
        await fetch("/api/capture/start", { method: "POST" });
        refresh();
      }

      async function stopCapture() {
        await fetch("/api/capture/stop", { method: "POST" });
        refresh();
      }

      refresh();
      setInterval(refresh, 2500);
    </script>
  </body>
</html>
